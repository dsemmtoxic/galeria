name: Publicar APK em Release (opcional)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publicar:
    name: Compilar e publicar APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar e validar Gradle Wrapper
        uses: gradle/actions/setup-gradle@v6

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar API Android 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Validar alteracoes no codigo
        run: python3 tests/SourceFlowChecks.py

      - name: Compilar APK debug assinado
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Preparar APK para publicacao
        run: python3 ci/prepare_apk.py

      - name: Validar assinatura e versao da tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk="dist/Galeria-${version}-debug.apk"
          test -s "$apk" || { echo 'A versao da tag nao corresponde ao versionName no app/build.gradle'; exit 1; }
          "${ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          sha256sum "$apk" | tee dist/SHA256SUMS.txt

      - name: Publicar APK no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="dist/Galeria-${GITHUB_REF_NAME#v}-debug.apk"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$apk" \
              --title "Galeria $GITHUB_REF_NAME" \
              --notes 'APK de testes compilado automaticamente e assinado com a chave de testes inclusa no projeto. Nao e uma assinatura de producao.'
          fi
