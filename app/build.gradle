plugins { id 'com.android.application' }

android {
    namespace 'app.galeria'
    compileSdk 35
    defaultConfig {
        applicationId 'app.galeria'
        minSdk 26
        targetSdk 35
        versionCode 21
        versionName '1.3.7'
    }
    signingConfigs {
        galeriaTeste {
            storeFile rootProject.file('signing/galeria-teste.jks')
            storePassword 'galeria-teste-2026'
            keyAlias 'galeria'
            keyPassword 'galeria-teste-2026'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.galeriaTeste }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint { abortOnError true }
}
